<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>噜噜 · 小世界</title>
    <style>
        /* 全局样式：柔和的背景，干净的字体 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f7f0e6 0%, #e8dfd3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 16px;
        }

        /* 主卡片——让内容集中，柔和阴影 */
        .lulu-card {
            background: rgba(255, 250, 240, 0.75);
            backdrop-filter: blur(8px);
            border-radius: 68px;
            padding: 40px 56px;
            box-shadow: 0 25px 40px -12px rgba(100, 70, 40, 0.35),
                        0 8px 20px rgba(0, 0, 0, 0.08),
                        inset 0 1px 4px rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 235, 210, 0.7);
            transition: transform 0.2s ease;
        }

        .lulu-card:hover {
            transform: scale(1.01);
        }

        /* 核心角色——噜噜 */
        .lulu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        /* 噜噜的“脸”/身体——用圆润的造型 */
        .lulu-face {
            position: relative;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle at 30% 30%, #ffeac2, #f7d9a8);
            border-radius: 50%;
            box-shadow: 
                0 12px 28px rgba(150, 110, 60, 0.3),
                inset 0 -6px 12px rgba(170, 120, 50, 0.2),
                inset 0 8px 18px rgba(255, 250, 230, 0.8);
            border: 3px solid #e7c99e;
            transition: all 0.25s;
        }

        /* 让噜噜轻微浮动（动画） */
        .lulu-face {
            animation: gentle-float 4s ease-in-out infinite;
        }

        @keyframes gentle-float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* 眼睛区域 */
        .eyes {
            display: flex;
            justify-content: center;
            gap: 48px;
            padding-top: 72px;
        }

        .eye {
            width: 58px;
            height: 58px;
            background: #3f2e1e;
            border-radius: 50%;
            box-shadow: inset 0 -6px 6px rgba(0,0,0,0.2), 0 6px 8px rgba(0,0,0,0.1);
            position: relative;
            transition: all 0.2s;
        }

        /* 瞳孔高光 */
        .eye::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 12px;
            width: 16px;
            height: 16px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px white;
            opacity: 0.95;
        }

        /* 第二个高光点，更小 */
        .eye::before {
            content: '';
            position: absolute;
            bottom: 12px;
            right: 10px;
            width: 8px;
            height: 8px;
            background: #ffffff;
            border-radius: 50%;
            opacity: 0.8;
            z-index: 1;
        }

        /* 腮红 */
        .blush {
            display: flex;
            justify-content: center;
            gap: 112px;
            position: absolute;
            bottom: 75px;
            left: 0;
            right: 0;
            pointer-events: none;
        }

        .blush-dot {
            width: 34px;
            height: 22px;
            background: #f8b8b0;
            border-radius: 50%;
            opacity: 0.6;
            filter: blur(4px);
            transform: rotate(5deg);
        }

        .blush-dot:last-child {
            transform: rotate(-5deg);
        }

        /* 嘴巴——用一个小弧线 */
        .mouth {
            position: absolute;
            bottom: 58px;
            left: 50%;
            transform: translateX(-50%);
            width: 64px;
            height: 34px;
            border-bottom: 6px solid #6b4f38;
            border-radius: 0 0 60px 60px;
            transition: all 0.25s;
            filter: drop-shadow(0 2px 2px rgba(120, 80, 40, 0.3));
        }

        /* 当鼠标悬停在脸上时，噜噜微笑更明显 */
        .lulu-face:hover .mouth {
            height: 40px;
            border-bottom-width: 7px;
            border-bottom-color: #875e3e;
        }

        /* 可爱的耳朵 / 小装饰 */
        .ear {
            position: absolute;
            top: -6px;
            width: 70px;
            height: 70px;
            background: #f3d4a8;
            border-radius: 50%;
            border: 3px solid #e7c99e;
            box-shadow: inset 0 -4px 8px rgba(160, 110, 50, 0.2);
        }

        .ear-left {
            left: 20px;
            transform: rotate(-15deg);
            border-bottom-right-radius: 30px;
        }

        .ear-right {
            right: 20px;
            transform: rotate(15deg);
            border-bottom-left-radius: 30px;
        }

        /* 名字标识——噜噜 */
        .lulu-name {
            font-size: 3.8rem;
            font-weight: 700;
            color: #754c24;
            text-shadow: 2px 4px 8px rgba(180, 130, 70, 0.3), 0 0 0 2px #fff1dd;
            letter-spacing: 6px;
            line-height: 1.2;
            margin-top: 8px;
            font-family: 'Quicksand', 'Segoe UI', sans-serif;
        }

        .lulu-name span {
            display: inline-block;
            animation: wave 2.2s infinite ease-in-out;
        }

        .lulu-name span:nth-child(1) { animation-delay: 0s; }
        .lulu-name span:nth-child(2) { animation-delay: 0.2s; }

        @keyframes wave {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* 小标签 */
        .tagline {
            color: #9b7b5c;
            font-size: 1.2rem;
            letter-spacing: 2px;
            font-weight: 500;
            text-align: center;
            border-top: 2px dashed #dbbd9a;
            padding-top: 18px;
            margin-top: 6px;
            opacity: 0.9;
        }

        /* 让噜噜的脸更生动——加个小鼻子 */
        .nose {
            position: absolute;
            top: 150px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 18px;
            background: #e5b78b;
            border-radius: 50% 50% 40% 40%;
            box-shadow: inset 0 -3px 5px rgba(140, 90, 40, 0.3);
            opacity: 0.9;
        }

        /* 小装饰——胡须之类的? 其实就是让噜噜更可爱 */
        .whisker {
            position: absolute;
            width: 50px;
            height: 6px;
            background: #caa87e;
            border-radius: 6px;
            opacity: 0.5;
            transform-origin: left center;
        }

        .whisker-left {
            top: 185px;
            left: 48px;
            transform: rotate(-10deg);
            box-shadow: 0 10px 0 #caa87e;
        }

        .whisker-right {
            top: 185px;
            right: 48px;
            transform: rotate(10deg);
            transform-origin: right center;
            box-shadow: 0 10px 0 #caa87e;
        }

        /* 小爪印或者小心心？ */
        .heart {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            opacity: 0.5;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: translateX(-50%) scale(0.9); }
            50% { opacity: 0.8; transform: translateX(-50%) scale(1.1); }
        }

        /* 响应式调整 */
        @media (max-width: 480px) {
            .lulu-card {
                padding: 28px 20px;
                border-radius: 48px;
            }
            .lulu-face {
                width: 230px;
                height: 230px;
            }
            .eyes {
                padding-top: 58px;
                gap: 36px;
            }
            .eye {
                width: 48px;
                height: 48px;
            }
            .eye::after {
                width: 12px;
                height: 12px;
                top: 8px;
                left: 10px;
            }
            .eye::before {
                width: 6px;
                height: 6px;
                bottom: 8px;
                right: 8px;
            }
            .nose {
                top: 122px;
                width: 20px;
                height: 15px;
            }
            .mouth {
                bottom: 48px;
                width: 54px;
                height: 26px;
            }
            .blush {
                bottom: 60px;
                gap: 88px;
            }
            .blush-dot {
                width: 28px;
                height: 18px;
            }
            .whisker {
                width: 40px;
                height: 5px;
            }
            .whisker-left {
                top: 152px;
                left: 36px;
            }
            .whisker-right {
                top: 152px;
                right: 36px;
            }
            .ear {
                width: 58px;
                height: 58px;
            }
            .ear-left {
                left: 14px;
            }
            .ear-right {
                right: 14px;
            }
            .lulu-name {
                font-size: 2.8rem;
            }
            .tagline {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="lulu-card">
        <div class="lulu">
            <!-- 噜噜的脸 -->
            <div class="lulu-face">
                <!-- 两只小耳朵 -->
                <div class="ear ear-left"></div>
                <div class="ear ear-right"></div>

                <!-- 眼睛 -->
                <div class="eyes">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>

                <!-- 小鼻子 -->
                <div class="nose"></div>

                <!-- 腮红（两个小圆晕） -->
                <div class="blush">
                    <div class="blush-dot"></div>
                    <div class="blush-dot"></div>
                </div>

                <!-- 嘴巴（微笑） -->
                <div class="mouth"></div>

                <!-- 小胡须装饰（两撇） -->
                <div class="whisker whisker-left"></div>
                <div class="whisker whisker-right"></div>

                <!-- 小小爱心，代表噜噜的心情 -->
                <div class="heart">❤️</div>
            </div>

            <!-- 名字：噜噜 （加一点波浪动画） -->
            <div class="lulu-name">
                <span>噜</span><span>噜</span>
            </div>

            <!-- 可爱的标语 -->
            <div class="tagline">✨ 一只很丑的老鼠 ✨ black</div>
            <div class="tagline">✨ 一只很可爱的噜噜 ✨</div>
        </div>
    </div>
</body>
</html>
